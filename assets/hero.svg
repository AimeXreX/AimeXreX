<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="AimeXreX animated banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050816"/><stop offset=".5" stop-color="#0b1026"/><stop offset="1" stop-color="#180d2d"/></linearGradient>
    <linearGradient id="neon" x1="0" x2="1"><stop stop-color="#22d3ee"><animate attributeName="stop-color" values="#22d3ee;#a78bfa;#22d3ee" dur="6s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#a855f7"><animate attributeName="stop-color" values="#a855f7;#ec4899;#a855f7" dur="6s" repeatCount="indefinite"/></stop></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#8b5cf6" stroke-opacity=".12"/></pattern>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/><rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <g fill="none" stroke="url(#neon)" filter="url(#glow)">
    <circle cx="105" cy="80" r="120" opacity=".32"><animate attributeName="r" values="105;135;105" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="1110" cy="300" r="150" opacity=".25"><animate attributeName="r" values="150;115;150" dur="8s" repeatCount="indefinite"/></circle>
    <path d="M0 285 Q180 215 350 285 T700 285 T1050 285 T1400 285" opacity=".42"><animate attributeName="d" dur="8s" repeatCount="indefinite" values="M0 285 Q180 215 350 285 T700 285 T1050 285 T1400 285;M0 285 Q180 340 350 285 T700 285 T1050 285 T1400 285;M0 285 Q180 215 350 285 T700 285 T1050 285 T1400 285"/></path>
  </g>
  <g font-family="JetBrains Mono,Segoe UI,monospace" text-anchor="middle">
    <text x="600" y="85" fill="#a78bfa" font-size="18" letter-spacing="8">HELLO WORLD</text>
    <text x="600" y="174" fill="url(#neon)" filter="url(#glow)" font-weight="800" font-size="74">AimeXreX</text>
    <text x="600" y="220" fill="#cbd5e1" font-size="22" letter-spacing="4">CODE • CREATE • AUTOMATE</text>
    <text x="600" y="268" fill="#64748b" font-size="15">Python Developer  /  Discord Automation  /  Open Source</text>
    <text x="600" y="318" fill="#8b5cf6" font-size="18">●</text><text x="624" y="318" text-anchor="start" fill="#94a3b8" font-size="14">SYSTEM ONLINE</text>
  </g>
  <rect x="1" y="1" width="1198" height="358" rx="23" fill="none" stroke="url(#neon)" stroke-opacity=".5"/>
</svg>